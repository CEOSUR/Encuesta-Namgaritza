<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEO SUR · Panel administrativo</title><style>body{font-family:Arial,sans-serif;background:#f4f6f5;color:#164b34;margin:0;padding:24px}main{max-width:1000px;margin:auto}input,button{padding:12px;border:1px solid #aaa;border-radius:7px;margin:5px}button{background:#164b34;color:white;cursor:pointer}table{width:100%;border-collapse:collapse;background:white}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}#panel{display:none}</style><main><h1>CEO SUR · Control administrativo</h1><section id="login"><p>Ingrese su contraseña de administrador.</p><input id="key" type="password" autocomplete="off" placeholder="Contraseña"><button id="enter">Ingresar</button><p id="message"></p></section><section id="panel"><h2 id="total"></h2><button id="refresh">Actualizar</button><button id="excel">Descargar Excel profesional (.xlsx)</button><button id="export">Exportar CSV</button><h3>Encuestas por encuestador</h3><table><thead><tr><th>Encuestador</th><th>Cantidad</th></tr></thead><tbody id="people"></tbody></table><h3>Encuestas por parroquia</h3><table><thead><tr><th>Parroquia</th><th>Cantidad</th></tr></thead><tbody id="parishes"></tbody></table></section></main><script>
let rows=[],secret='';const el=id=>document.getElementById(id);
function summary(id,field){const totals={};rows.forEach(r=>{const key=String(r[field]||'Sin registrar');totals[key]=(totals[key]||0)+1});el(id).replaceChildren(...Object.entries(totals).sort((a,b)=>b[1]-a[1]).map(([name,n])=>{const tr=document.createElement('tr');for(const v of [name,n]){const td=document.createElement('td');td.textContent=v;tr.append(td)}return tr}))}
async function load(){const res=await fetch('/api/admin/data',{headers:{'x-admin-key':secret},cache:'no-store'});if(!res.ok)throw Error('No se pudo ingresar. Compruebe la contraseña y configuración.');rows=(await res.json()).encuestas;el('login').style.display='none';el('panel').style.display='block';el('total').textContent='Total general: '+rows.length;summary('people','encuestador');summary('parishes','parroquia')}
el('enter').onclick=async()=>{secret=el('key').value;try{await load()}catch(e){el('message').textContent=e.message}};
el('refresh').onclick=load;el('excel').onclick=async()=>{try{const res=await fetch('/api/admin/excel',{headers:{'x-admin-key':secret}});if(!res.ok)throw Error('No se pudo generar el Excel');const blob=await res.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='CEO_SUR_Nangaritza_Informe_Profesional.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}catch(e){alert(e.message)}};
el('export').onclick=()=>{const fields=[...new Set(rows.flatMap(Object.keys))],q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const csv=[fields.map(q).join(','),...rows.map(r=>fields.map(f=>q(r[f])).join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='CEO_SUR_Nangaritza.csv';a.click();URL.revokeObjectURL(a.href)};
</script></html>
